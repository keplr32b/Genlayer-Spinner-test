<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Loading Spinner - Portal Community Design</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
    }

    /* GenLayer Carbon Dark Mode */
    .dark-bg {
      background-color: #0B0F17;
      color: #FFFFFF;
      --track-color: rgba(255, 255, 255, 0.1);
    }

    /* Light Mode */
    .light-bg {
      background-color: #F4F6F8;
      color: #0B0F17;
      --track-color: rgba(0, 0, 0, 0.08);
    }

    .preview-card h3 {
      font-size: 0.95rem;
      letter-spacing: 1px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    /* Spinner Container */
    .genlayer-spinner {
      width: 90px;
      height: 90px;
    }

    /* Track Ring */
    .gl-track {
      fill: none;
      stroke: var(--track-color);
      stroke-width: 4;
    }

    /* Outer Spin Arc */
    .gl-arc {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 160;
      transform-origin: 50px 50px;
      animation: gl-spin 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Center GenLayer Brand Diamonds */
    .gl-logo-core {
      transform-origin: 50px 50px;
      animation: gl-pulse 1.8s ease-in-out infinite;
    }

    @keyframes gl-spin {
      0% {
        transform: rotate(0deg);
        stroke-dashoffset: 180;
      }
      50% {
        stroke-dashoffset: 50;
        transform: rotate(180deg);
      }
      100% {
        transform: rotate(360deg);
        stroke-dashoffset: 180;
      }
    }

    @keyframes gl-pulse {
      0%, 100% {
        transform: scale(0.88);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Dark Theme -->
  <div class="preview-card dark-bg">
    <h3>Dark Theme Preview</h3>
    <svg class="genlayer-spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- GenLayer Official Electric Emerald to Cyan Gradient -->
        <linearGradient id="gl-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00FF88" />
          <stop offset="50%" stop-color="#00E5FF" />
          <stop offset="100%" stop-color="#7000FF" />
        </linearGradient>

        <filter id="gl-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <circle class="gl-track" cx="50" cy="50" r="36" />
      <circle class="gl-arc" cx="50" cy="50" r="36" stroke="url(#gl-grad-dark)" filter="url(#gl-glow)" />

      <!-- Authentic GenLayer Geometric Motif -->
      <g class="gl-logo-core">
        <polygon points="50,28 62,40 50,52 38,40" fill="url(#gl-grad-dark)" />
        <polygon points="50,54 62,66 50,78 38,66" fill="url(#gl-grad-dark)" opacity="0.8" />
        <polygon points="36,42 48,54 36,66 24,54" fill="url(#gl-grad-dark)" opacity="0.6" />
        <polygon points="64,42 76,54 64,66 52,54" fill="url(#gl-grad-dark)" opacity="0.6" />
      </g>
    </svg>
  </div>

  <!-- Light Theme -->
  <div class="preview-card light-bg">
    <h3>Light Theme Preview</h3>
    <svg class="genlayer-spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gl-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00C853" />
          <stop offset="50%" stop-color="#0091EA" />
          <stop offset="100%" stop-color="#6200EA" />
        </linearGradient>
      </defs>

      <circle class="gl-track" cx="50" cy="50" r="36" />
      <circle class="gl-arc" cx="50" cy="50" r="36" stroke="url(#gl-grad-light)" />

      <!-- Authentic GenLayer Geometric Motif -->
      <g class="gl-logo-core">
        <polygon points="50,28 62,40 50,52 38,40" fill="url(#gl-grad-light)" />
        <polygon points="50,54 62,66 50,78 38,66" fill="url(#gl-grad-light)" opacity="0.8" />
        <polygon points="36,42 48,54 36,66 24,54" fill="url(#gl-grad-light)" opacity="0.6" />
        <polygon points="64,42 76,54 64,66 52,54" fill="url(#gl-grad-light)" opacity="0.6" />
      </g>
    </svg>
  </div>

</body>
</html>
