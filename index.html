<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #030408;
      gap: 24px;
      padding: 20px;
    }

    @media (max-width: 820px) {
      body {
        flex-direction: column;
      }
    }

    /* CARD STRUCTURE */
    .card {
      width: 420px;
      height: 380px;
      border-radius: 24px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* HEADER */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #1d4ed8;
      border-radius: 50%;
      box-shadow: 0 0 10px #3b82f6;
    }

    /* DARK CARD STYLING */
    .card.dark {
      background: radial-gradient(circle at center, #111428 0%, #0a0c16 100%);
      border: 1px solid #1e2238;
      color: #ffffff;
    }

    .card.dark .card-header {
      color: #94a3b8;
    }

    .card.dark .content p {
      color: #64748b;
    }

    /* LIGHT CARD STYLING */
    .card.light {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }

    .card.light .card-header {
      color: #64748b;
    }

    .card.light .content p {
      color: #94a3b8;
    }

    /* CENTER SPINNER AREA */
    .spinner-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    /* SPINNER ANIMATIONS */
    .genlayer-spinner {
      width: 120px;
      height: 120px;
      overflow: visible;
    }

    .gl-outer-ring {
      transform-origin: 50px 50px;
      animation: gl-rotate-cw 3s linear infinite;
    }

    .gl-inner-ring {
      transform-origin: 50px 50px;
      animation: gl-rotate-ccw 2.2s linear infinite;
    }

    .gl-logo-center {
      transform-origin: 50px 50px;
      animation: gl-rotate-cw 4s linear infinite;
    }

    @keyframes gl-rotate-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes gl-rotate-ccw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* TEXT CONTENT AREA */
    .content h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .content p {
      font-size: 0.9rem;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <!-- DARK INTERFACE CARD -->
  <div class="card dark">
    <div class="card-header">
      DARK INTERFACE
      <div class="status-dot"></div>
    </div>

    <div class="spinner-container">
      <svg class="genlayer-spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gl-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00FF88" />
            <stop offset="50%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#7000FF" />
          </linearGradient>
        </defs>

        <!-- Outer Orbit with Nodes -->
        <g class="gl-outer-ring">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#7000FF" stroke-width="1.5" stroke-dasharray="12 18 35 15" opacity="0.6"/>
          <circle cx="50" cy="6" r="3.5" fill="#00FF88" />
          <circle cx="94" cy="50" r="2.5" fill="#00E5FF" />
        </g>

        <!-- Inner Counter-Rotating Orbit -->
        <g class="gl-inner-ring">
          <circle cx="50" cy="50" r="34" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="45 20" opacity="0.8"/>
          <circle cx="16" cy="50" r="3" fill="#7000FF" />
          <circle cx="50" cy="84" r="2" fill="#00FF88" />
        </g>

        <!-- Centered Rotating Logo Symbol -->
        <g class="gl-logo-center">
          <path fill="url(#gl-dark-grad)" fill-rule="evenodd" d="
            M 50,15 
            L 18,81 
            L 34,81 
            L 44,60 
            L 44,15 
            L 50,15 
            Z
            M 50,15 
            L 82,81 
            L 66,81 
            L 56,60 
            L 56,15 
            L 50,15 
            Z
            M 50,37 
            L 36,66 
            L 64,66 
            Z
          " />
        </g>
      </svg>
    </div>

    <div class="content">
      <h2>Verifying state</h2>
      <p>Validator signals are converging.</p>
    </div>
  </div>

  <!-- LIGHT INTERFACE CARD -->
  <div class="card light">
    <div class="card-header">
      LIGHT INTERFACE
      <div class="status-dot"></div>
    </div>

    <div class="spinner-container">
      <svg class="genlayer-spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gl-light-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00C853" />
            <stop offset="50%" stop-color="#0091EA" />
            <stop offset="100%" stop-color="#6200EA" />
          </linearGradient>
        </defs>

        <g class="gl-outer-ring">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#6200EA" stroke-width="1.5" stroke-dasharray="12 18 35 15" opacity="0.4"/>
          <circle cx="50" cy="6" r="3.5" fill="#00C853" />
          <circle cx="94" cy="50" r="2.5" fill="#0091EA" />
        </g>

        <g class="gl-inner-ring">
          <circle cx="50" cy="50" r="34" fill="none" stroke="#0091EA" stroke-width="1.5" stroke-dasharray="45 20" opacity="0.6"/>
          <circle cx="16" cy="50" r="3" fill="#6200EA" />
          <circle cx="50" cy="84" r="2" fill="#00C853" />
        </g>

        <g class="gl-logo-center">
          <path fill="url(#gl-light-grad)" fill-rule="evenodd" d="
            M 50,15 
            L 18,81 
            L 34,81 
            L 44,60 
            L 44,15 
            L 50,15 
            Z
            M 50,15 
            L 82,81 
            L 66,81 
            L 56,60 
            L 56,15 
            L 50,15 
            Z
            M 50,37 
            L 36,66 
            L 64,66 
            Z
          " />
        </g>
      </svg>
    </div>

    <div class="content">
      <h2>Resolving result</h2>
      <p>Waiting for collective agreement.</p>
    </div>
  </div>

</body>
</html>
