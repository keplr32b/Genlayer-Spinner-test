<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Validator Interface</title>
  <style>
    body { background-color: #030408; font-family: sans-serif; display: flex; gap: 20px; padding: 40px; justify-content: center; min-height: 100vh; margin: 0; color: #fff; }
    
    /* CARD DESIGN */
    .card { width: 450px; border-radius: 28px; padding: 32px; border: 1px solid #1f2937; }
    .card.dark { background: #0b0f17; }
    .card.light { background: #ffffff; color: #0b0f17; border-color: #e2e8f0; }

    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; opacity: 0.6; }
    .status-dot { width: 8px; height: 8px; background-color: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px #3b82f6; }

    /* ROW SETUP */
    .state-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
    .state-info h4 { margin: 0; font-size: 1.1rem; }
    .state-info p { margin: 4px 0 0 0; opacity: 0.5; font-size: 0.85rem; }

    /* THE SPINNER WRAPPER (Your exact logic) */
    .spinner-wrapper { width: 60px; height: 60px; position: relative; display: flex; align-items: center; justify-content: center; }
    .ring-outer, .ring-inner { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .ring-outer { animation: rotate-cw 4s linear infinite; }
    .ring-inner { animation: rotate-ccw 3s linear infinite; }

    /* YOUR EXACT LOGO ROTATION */
    .gl-logo-center { width: 25px; height: 25px; fill: currentColor; animation: rotate-cw 3s linear infinite; transform-origin: center; }

    @keyframes rotate-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotate-ccw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
  </style>
</head>
<body>

  <!-- DARK INTERFACE -->
  <div class="card dark">
    <div class="card-header">DARK INTERFACE <div class="status-dot"></div></div>
    
    <div class="state-row">
      <div class="state-info">
        <h4>Verifying state</h4>
        <p>Validator signals are converging.</p>
      </div>
      <div class="spinner-wrapper">
        <svg class="ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#00FF88" stroke-width="3" stroke-dasharray="10 20" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="5 15" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>

    <div class="state-row">
      <div class="state-info">
        <h4>Resolving result</h4>
        <p>Waiting for collective agreement.</p>
      </div>
      <div class="spinner-wrapper">
        <svg class="ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#00FF88" stroke-width="3" stroke-dasharray="10 20" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="5 15" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>
  </div>

  <!-- LIGHT INTERFACE -->
  <div class="card light">
    <div class="card-header">LIGHT INTERFACE <div class="status-dot"></div></div>
    
    <div class="state-row">
      <div class="state-info">
        <h4>Verifying state</h4>
        <p>Validator signals are converging.</p>
      </div>
      <div class="spinner-wrapper">
        <svg class="ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#6200EA" stroke-width="3" stroke-dasharray="10 20" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#0091EA" stroke-width="3" stroke-dasharray="5 15" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>

    <div class="state-row">
      <div class="state-info">
        <h4>Resolving result</h4>
        <p>Waiting for collective agreement.</p>
      </div>
      <div class="spinner-wrapper">
        <svg class="ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#6200EA" stroke-width="3" stroke-dasharray="10 20" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#0091EA" stroke-width="3" stroke-dasharray="5 15" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>
  </div>

</body>
</html>
