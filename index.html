<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Validator Interface</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #030408; font-family: sans-serif; display: flex; gap: 24px; padding: 40px 20px; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }

    .card { width: 440px; border-radius: 28px; padding: 32px; border: 1px solid #1f2937; display: flex; flex-direction: column; gap: 32px; }
    .card.dark { background: #0b0f17; }
    .card.light { background: #ffffff; color: #0b0f17; border-color: #e2e8f0; }

    .state-row { display: flex; align-items: center; justify-content: space-between; }
    .state-info h4 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .state-info p { font-size: 0.85rem; opacity: 0.5; }

    .spinner-wrapper { width: 64px; height: 64px; position: relative; display: flex; align-items: center; justify-content: center; }
    .ring { position: absolute; width: 100%; height: 100%; }

    /* --- UNIQUE ANIMATIONS --- */

    /* 1. VERIFYING: "Breathing/Thinking" Rotation (Easing) */
    .verifying-spin .ring-outer { animation: rotate-smooth 4s ease-in-out infinite; }
    .verifying-spin .ring-inner { animation: rotate-smooth 4s ease-in-out infinite reverse; }

    /* 2. RESOLVING: "Burst & Pause" Rotation (Steps) */
    .resolving-spin .ring-outer, 
    .resolving-spin .ring-inner { 
      animation: rotate-pause 5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; 
    }

    @keyframes rotate-smooth {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotate-pause {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(360deg); } /* Fast spin */
      100% { transform: rotate(360deg); } /* Pause here */
    }

    /* Logo stays standard */
    .gl-logo-center { width: 26px; height: 26px; fill: currentColor; transform-origin: center; animation: rotate-cw 3s linear infinite; }
    @keyframes rotate-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- DARK CARD -->
  <div class="card dark">
    <div class="state-row">
      <div class="state-info">
        <h4>Verifying state</h4>
        <p>Crunching validator signals...</p>
      </div>
      <div class="spinner-wrapper verifying-spin">
        <svg class="ring ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#00FF88" stroke-width="3" stroke-dasharray="10 20" /></svg>
        <svg class="ring ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="6 14" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>

    <div class="state-row">
      <div class="state-info">
        <h4>Resolving result</h4>
        <p>Finalizing collective consensus.</p>
      </div>
      <div class="spinner-wrapper resolving-spin">
        <svg class="ring ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#00FF88" stroke-width="3" stroke-dasharray="12 18" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="8 12" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>
  </div>

  <!-- LIGHT CARD (Same logic applies) -->
  <div class="card light">
    <div class="state-row">
      <div class="state-info">
        <h4>Verifying state</h4>
        <p>Crunching validator signals...</p>
      </div>
      <div class="spinner-wrapper verifying-spin">
        <svg class="ring ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#6200EA" stroke-width="3" stroke-dasharray="10 20" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#0091EA" stroke-width="3" stroke-dasharray="6 14" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>

    <div class="state-row">
      <div class="state-info">
        <h4>Resolving result</h4>
        <p>Finalizing collective consensus.</p>
      </div>
      <div class="spinner-wrapper resolving-spin">
        <svg class="ring ring-outer" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#6200EA" stroke-width="3" stroke-dasharray="12 18" /></svg>
        <svg class="ring-inner" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#0091EA" stroke-width="3" stroke-dasharray="8 12" /></svg>
        <svg class="gl-logo-center" viewBox="0 0 100 100"><path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" /></svg>
      </div>
    </div>
  </div>

</body>
</html>
