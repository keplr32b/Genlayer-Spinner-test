<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Animated Orbital Spinner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      background-color: #f0f3f8;
    }

    @media (max-width: 768px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
    }

    /* Dark Mode */
    .dark-bg {
      background-color: #0b0f17;
      color: #ffffff;
    }

    /* Light Mode */
    .light-bg {
      background-color: #f8fafc;
      color: #0b0f17;
    }

    .preview-card h3 {
      font-size: 0.9rem;
      letter-spacing: 1px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    /* Multi-Size Showcase Container */
    .spinner-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Main SVG Container Base */
    .gl-orbital-spinner {
      display: inline-block;
      overflow: visible;
    }

    /* Sizing Utilities */
    .size-lg { width: 100px; height: 100px; }
    .size-md { width: 64px; height: 64px; }
    .size-sm { width: 36px; height: 36px; }

    /* Orbital Motion System */
    .ring-outer {
      transform-origin: 50px 50px;
      animation: spin-clockwise 3s linear infinite;
    }

    .ring-inner {
      transform-origin: 50px 50px;
      animation: spin-counter-clockwise 2.2s linear infinite;
    }

    .core-pulse {
      transform-origin: 50px 50px;
      animation: core-breathe 2s ease-in-out infinite;
    }

    /* Keyframe Animations */
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-counter-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes core-breathe {
      0%, 100% { transform: scale(0.92); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Dark Theme Preview -->
  <div class="preview-card dark-bg">
    <h3>Dark Theme Preview</h3>
    <div class="spinner-showcase">
      <!-- Large (100px) -->
      <svg class="gl-orbital-spinner size-lg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer Rotating Ring & Nodes -->
        <g class="ring-outer">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#7000FF" stroke-width="1.5" stroke-dasharray="10 15 30 15" opacity="0.6"/>
          <circle cx="50" cy="8" r="3.5" fill="#00FF88" />
          <circle cx="92" cy="50" r="2.5" fill="#00E5FF" />
        </g>

        <!-- Inner Counter-Rotating Ring & Nodes -->
        <g class="ring-inner">
          <circle cx="50" cy="50" r="32" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="40 20" stroke-linecap="round" opacity="0.8"/>
          <circle cx="18" cy="50" r="3" fill="#7000FF" />
          <circle cx="50" cy="82" r="2" fill="#00FF88" />
        </g>

        <!-- Center Isometric GenLayer Cube / Diamond -->
        <g class="core-pulse">
          <!-- Top Face -->
          <polygon points="50,26 66,35 50,44 34,35" fill="#00FF88" opacity="0.9"/>
          <!-- Left Face -->
          <polygon points="34,35 50,44 50,64 34,55" fill="#00E5FF" opacity="0.8"/>
          <!-- Right Face -->
          <polygon points="50,44 66,35 66,55 50,64" fill="#7000FF" opacity="0.85"/>
          <!-- Inner Node Lines -->
          <line x1="50" y1="44" x2="50" y2="64" stroke="#0b0f17" stroke-width="1.5"/>
          <line x1="50" y1="44" x2="34" y2="35" stroke="#0b0f17" stroke-width="1.5"/>
          <line x1="50" y1="44" x2="66" y2="35" stroke="#0b0f17" stroke-width="1.5"/>
        </g>
      </svg>

      <!-- Medium (64px) -->
      <svg class="gl-orbital-spinner size-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g class="ring-outer">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#7000FF" stroke-width="2" stroke-dasharray="10 15 30 15" opacity="0.6"/>
          <circle cx="50" cy="8" r="4" fill="#00FF88" />
        </g>
        <g class="ring-inner">
          <circle cx="50" cy="50" r="32" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="40 20" opacity="0.8"/>
          <circle cx="18" cy="50" r="3.5" fill="#7000FF" />
        </g>
        <g class="core-pulse">
          <polygon points="50,26 66,35 50,44 34,35" fill="#00FF88" />
          <polygon points="34,35 50,44 50,64 34,55" fill="#00E5FF" />
          <polygon points="50,44 66,35 66,55 50,64" fill="#7000FF" />
        </g>
      </svg>
    </div>
  </div>

  <!-- Light Theme Preview -->
  <div class="preview-card light-bg">
    <h3>Light Theme Preview</h3>
    <div class="spinner-showcase">
      <!-- Large (100px) -->
      <svg class="gl-orbital-spinner size-lg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g class="ring-outer">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#6200EA" stroke-width="1.5" stroke-dasharray="10 15 30 15" opacity="0.5"/>
          <circle cx="50" cy="8" r="3.5" fill="#00C853" />
          <circle cx="92" cy="50" r="2.5" fill="#0091EA" />
        </g>

        <g class="ring-inner">
          <circle cx="50" cy="50" r="32" fill="none" stroke="#0091EA" stroke-width="1.5" stroke-dasharray="40 20" stroke-linecap="round" opacity="0.7"/>
          <circle cx="18" cy="50" r="3" fill="#6200EA" />
          <circle cx="50" cy="82" r="2" fill="#00C853" />
        </g>

        <g class="core-pulse">
          <polygon points="50,26 66,35 50,44 34,35" fill="#00C853" />
          <polygon points="34,35 50,44 50,64 34,55" fill="#0091EA" />
          <polygon points="50,44 66,35 66,55 50,64" fill="#6200EA" />
          <line x1="50" y1="44" x2="50" y2="64" stroke="#ffffff" stroke-width="1.5"/>
          <line x1="50" y1="44" x2="34" y2="35" stroke="#ffffff" stroke-width="1.5"/>
          <line x1="50" y1="44" x2="66" y2="35" stroke="#ffffff" stroke-width="1.5"/>
        </g>
      </svg>

      <!-- Medium (64px) -->
      <svg class="gl-orbital-spinner size-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g class="ring-outer">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#6200EA" stroke-width="2" stroke-dasharray="10 15 30 15" opacity="0.5"/>
          <circle cx="50" cy="8" r="4" fill="#00C853" />
        </g>
        <g class="ring-inner">
          <circle cx="50" cy="50" r="32" fill="none" stroke="#0091EA" stroke-width="2" stroke-dasharray="40 20" opacity="0.7"/>
          <circle cx="18" cy="50" r="3.5" fill="#6200EA" />
        </g>
        <g class="core-pulse">
          <polygon points="50,26 66,35 50,44 34,35" fill="#00C853" />
          <polygon points="34,35 50,44 50,64 34,55" fill="#0091EA" />
          <polygon points="50,44 66,35 66,55 50,64" fill="#6200EA" />
        </g>
      </svg>
    </div>
  </div>

</body>
</html>
