<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Portal — Fragment Finality</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="gl-spinner" role="status" aria-label="Loading">
      <svg viewBox="0 0 97.76 91.93" xmlns="http://www.w3.org/2000/svg">
        <polygon class="gl-part gl-left"  points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
        <polygon class="gl-part gl-right" points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
        <polygon class="gl-part gl-center" points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
      </svg>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <nav class="topnav">
      <div class="brand">
        <svg viewBox="0 0 97.76 91.93" fill="currentColor">
          <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
          <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
          <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
        </svg>
        GenLayer
      </div>
      <div class="nav-links">
        <a href="#" class="active">Overview</a>
        <a href="#">Builders</a>
        <a href="#">Validators</a>
        <a href="#">Studio</a>
      </div>
      <div>
        <button class="btn">Connect Wallet</button>
      </div>
    </nav>

    <section class="hero-section">
      <div class="hero-badge">Adjudication Layer</div>
      <h1>Consensus for the<br><span>Agentic Economy</span></h1>
      <p>Decentralized AI validators that reason, evaluate evidence, and finalize outcomes on-chain.</p>
      <div class="hero-actions">
        <button class="btn">Enter Portal</button>
        <button class="btn-outline">Read Docs</button>
      </div>
    </section>

    <div class="stats-strip">
      <div class="stat">
        <div class="num">2,204</div>
        <div class="lbl">Builders</div>
      </div>
      <div class="stat">
        <div class="num">46</div>
        <div class="lbl">Validators</div>
      </div>
      <div class="stat">
        <div class="num">16.5k</div>
        <div class="lbl">Creators</div>
      </div>
      <div class="stat">
        <div class="num">Q4 2026</div>
        <div class="lbl">Mainnet Target</div>
      </div>
    </div>
  </div>

  <button class="replay-btn" id="replayBtn">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M1 4v6h6M23 20v-6h-6"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    Replay Loading
  </button>

  <script>
    const loader = document.getElementById('loader');
    const app = document.getElementById('app');
    const replayBtn = document.getElementById('replayBtn');

    function showApp() {
      loader.classList.add('hidden');
      app.classList.add('visible');
    }

    function replay() {
      loader.classList.remove('hidden');
      app.classList.remove('visible');
      void loader.offsetWidth;
      setTimeout(showApp, 2700);
    }

    setTimeout(showApp, 2700);
    replayBtn.addEventListener('click', replay);
  </script>
</body>
</html>
