<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Official Spinner</title>
  <style>
    body { background-color: #0b0f17; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    
    .spinner-wrapper { width: 120px; height: 120px; position: relative; display: flex; align-items: center; justify-content: center; }

    /* RINGS */
    .ring-outer, .ring-inner { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .ring-outer { animation: rotate-cw 4s linear infinite; }
    .ring-inner { animation: rotate-ccw 3s linear infinite; }

    /* LOGO ROTATION (No Pulse, only Rotate) */
    .gl-logo-center {
      width: 40px;
      height: 40px;
      fill: #ffffff;
      animation: rotate-cw 3s linear infinite; /* Logo rotating */
      transform-origin: center;
    }

    @keyframes rotate-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotate-ccw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
  </style>
</head>
<body>

<div class="spinner-wrapper">
  <!-- Outer Orbit -->
  <svg class="ring-outer" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#00FF88" stroke-width="2" stroke-dasharray="10 20" />
  </svg>

  <!-- Inner Orbit -->
  <svg class="ring-inner" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="35" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="5 15" />
  </svg>

  <!-- OFFICIAL LOGO (The Triangle Shape) -->
  <svg class="gl-logo-center" viewBox="0 0 100 100">
    <!-- Ye path aapke diye gaye image ke exact triangular shape ko represent karta hai -->
    <path d="M50 10 L 90 90 L 50 70 L 10 90 Z M50 30 L 35 70 L 65 70 Z" />
  </svg>
</div>

</body>
</html>
