<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenLayer Interface</title>
  <style>
    body {
      background-color: #050508;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
      padding: 20px;
    }

    /* CARD DESIGN */
    .card {
      width: 380px;
      border-radius: 28px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    /* HEADER */
    .header {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #3b82f6;
      border-radius: 50%;
      box-shadow: 0 0 8px #3b82f6;
    }

    /* DARK CARD */
    .card.dark {
      background: #0f111a;
      border: 1px solid #2a2d3e;
      color: #ffffff;
    }

    /* LIGHT CARD */
    .card.light {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #1e293b;
    }

    .card.light .header { color: #64748b; }

    /* TEXT CONTENT */
    .content h2 { margin: 0; font-size: 1.25rem; }
    .content p { margin: 8px 0 0 0; opacity: 0.6; font-size: 0.95rem; }

    /* SPINNER CONTAINER */
    .spinner-container {
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* SVG SPINNER LOGIC (Same as previous) */
    .genlayer-spinner { width: 100px; height: 100px; }
    .gl-outer-ring { transform-origin: 50px 50px; animation: rotate-cw 4s linear infinite; }
    .gl-inner-ring { transform-origin: 50px 50px; animation: rotate-ccw 3s linear infinite; }
    .gl-logo-center { transform-origin: 50px 50px; animation: rotate-cw 6s linear infinite; }

    @keyframes rotate-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotate-ccw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
  </style>
</head>
<body>

  <!-- DARK INTERFACE CARD -->
  <div class="card dark">
    <div class="header">
      DARK INTERFACE <div class="status-dot"></div>
    </div>
    
    <div class="spinner-container">
      <svg class="genlayer-spinner" viewBox="0 0 100 100">
        <!-- Rings -->
        <circle class="gl-outer-ring" cx="50" cy="50" r="40" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 10" opacity="0.5"/>
        <circle class="gl-inner-ring" cx="50" cy="50" r="30" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 15" opacity="0.5"/>
        
        <!-- Logo -->
        <g class="gl-logo-center" fill="#ffffff">
          <path d="M50 20 L 20 80 L 80 80 Z M50 35 L 35 70 L 65 70 Z" />
        </g>
      </svg>
    </div>

    <div class="content">
      <h2>Verifying state</h2>
      <p>Validator signals are converging.</p>
    </div>
  </div>

  <!-- LIGHT INTERFACE CARD -->
  <div class="card light">
    <div class="header">
      LIGHT INTERFACE <div class="status-dot"></div>
    </div>

    <div class="spinner-container">
      <svg class="genlayer-spinner" viewBox="0 0 100 100">
        <!-- Rings -->
        <circle class="gl-outer-ring" cx="50" cy="50" r="40" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 10" opacity="0.3"/>
        <circle class="gl-inner-ring" cx="50" cy="50" r="30" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 15" opacity="0.3"/>
        
        <!-- Logo -->
        <g class="gl-logo-center" fill="#1e293b">
          <path d="M50 20 L 20 80 L 80 80 Z M50 35 L 35 70 L 65 70 Z" />
        </g>
      </svg>
    </div>

    <div class="content">
      <h2>Resolving result</h2>
      <p>Waiting for collective agreement.</p>
    </div>
  </div>

</body>
</html>
