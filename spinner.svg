<svg
  class="gl-consensus-spinner"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Loading"
>
  <title>GenLayer Consensus Signal Spinner</title>

  <style>
    svg {
      color: #070707;
    }

    .gl-track {
      fill: none;
      stroke: currentColor;
      stroke-opacity: 0.14;
      stroke-width: 3.5;
    }

    .gl-signal {
      fill: none;
      stroke: #110fff;
      stroke-linecap: round;
      stroke-width: 4.5;
      transform-box: fill-box;
      transform-origin: center;
    }

    .gl-signal--one {
      stroke-dasharray: 32 232;
      animation: gl-consensus-orbit 1.6s linear infinite;
    }

    .gl-signal--two {
      stroke-dasharray: 20 244;
      stroke-opacity: 0.72;
      animation: gl-consensus-orbit 1.6s linear -0.53s infinite;
    }

    .gl-signal--three {
      stroke-dasharray: 11 253;
      stroke-opacity: 0.45;
      animation: gl-consensus-orbit 1.6s linear -1.06s infinite;
    }

    .gl-symbol {
      fill: currentColor;
      transform-origin: 50px 50px;
      animation: gl-core-settle 1.6s ease-in-out infinite;
    }

    @keyframes gl-consensus-orbit {
      0% {
        opacity: 0.55;
        transform: rotate(-90deg) scale(0.98);
      }

      45% {
        opacity: 1;
        transform: rotate(72deg) scale(1);
      }

      100% {
        opacity: 0.55;
        transform: rotate(270deg) scale(0.98);
      }
    }

    @keyframes gl-core-settle {
      0%,
      100% {
        opacity: 0.86;
        transform: scale(0.94);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-signal,
      .gl-symbol {
        animation: none;
      }
    }
  </style>

  <circle class="gl-track" cx="50" cy="50" r="42"/>
  <circle class="gl-signal gl-signal--one" cx="50" cy="50" r="42"/>
  <circle class="gl-signal gl-signal--two" cx="50" cy="50" r="42"/>
  <circle class="gl-signal gl-signal--three" cx="50" cy="50" r="42"/>

  <svg
    class="gl-symbol"
    x="35"
    y="35"
    width="30"
    height="30"
    viewBox="0 0 97.76 91.93"
    aria-hidden="true"
  >
    <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
    <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
    <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
  </svg>
</svg>
