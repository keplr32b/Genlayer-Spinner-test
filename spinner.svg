<svg
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="GenLayer loading"
>
  <title>GenLayer Consensus Signal Spinner</title>

  <style>
    svg {
      color: #070707;
    }

    .gl-track {
      fill: none;
      stroke: currentColor;
      stroke-opacity: 0.14;
      stroke-width: 3;
    }

    .gl-signal {
      fill: none;
      stroke: #110fff;
      stroke-linecap: round;
      stroke-width: 5;
      transform-box: fill-box;
      transform-origin: center;
    }

    .gl-signal--one {
      stroke-dasharray: 44 220;
      animation: gl-signal-orbit 1.45s linear infinite;
    }

    .gl-signal--two {
      stroke-dasharray: 28 236;
      stroke-opacity: 0.75;
      animation: gl-signal-orbit 1.45s linear -0.48s infinite;
    }

    .gl-signal--three {
      stroke-dasharray: 15 249;
      stroke-opacity: 0.5;
      animation: gl-signal-orbit 1.45s linear -0.96s infinite;
    }

    .gl-symbol {
      fill: currentColor;
      transform-origin: 50px 50px;
      animation: gl-core-pulse 1.45s ease-in-out infinite;
    }

    @keyframes gl-signal-orbit {
      0% {
        opacity: 0.56;
        transform: rotate(-90deg);
      }

      42% {
        opacity: 1;
      }

      100% {
        opacity: 0.56;
        transform: rotate(270deg);
      }
    }

    @keyframes gl-core-pulse {
      0%,
      100% {
        opacity: 0.88;
        transform: scale(0.94);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-signal,
      .gl-symbol {
        animation: none;
      }
    }
  </style>

  <circle class="gl-track" cx="50" cy="50" r="42"/>

  <circle class="gl-signal gl-signal--one" cx="50" cy="50" r="42"/>
  <circle class="gl-signal gl-signal--two" cx="50" cy="50" r="42"/>
  <circle class="gl-signal gl-signal--three" cx="50" cy="50" r="42"/>

  <svg
    class="gl-symbol"
    x="34"
    y="34"
    width="32"
    height="32"
    viewBox="0 0 97.76 91.93"
    aria-hidden="true"
  >
    <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0 44.26 32.35"/>
    <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0 53.5 32.35"/>
    <polygon points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92 48.64 43.78"/>
  </svg>
</svg>
