<svg class="genlayer-spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="status" aria-label="Loading">
  <defs>
    <!-- GenLayer Brand Gradient -->
    <linearGradient id="gl-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110FFF" />
      <stop offset="50%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#110FFF" />
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="gl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbital Arc (Consensus Loop) -->
  <circle
    class="gl-track"
    cx="50" cy="50" r="38"
  />
  <circle
    class="gl-arc"
    cx="50" cy="50" r="38"
    stroke="url(#gl-gradient)"
    filter="url(#gl-glow)"
  />

  <!-- Center Core (GenLayer Geometric Symbol Motif) -->
  <g class="gl-core">
    <polygon points="50,26 68,64 50,54 32,64" fill="url(#gl-gradient)" />
  </g>
</svg>

<style>
  /* Container Sizing Variable */
  .genlayer-spinner {
    width: var(--spinner-size, 64px);
    height: var(--spinner-size, 64px);
    display: inline-block;
    vertical-align: middle;
  }

  /* Background Ring Track (Theme Adaptive) */
  .gl-track {
    fill: none;
    stroke: currentColor;
    opacity: 0.12;
    stroke-width: 5;
  }

  /* Infinite Smooth Rotating Arc */
  .gl-arc {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 238; /* Circumference of r=38 */
    stroke-dashoffset: 180;
    transform-origin: 50px 50px;
    animation: gl-spin 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  /* Breathing Center Core */
  .gl-core {
    transform-origin: 50px 50px;
    animation: gl-pulse 1.8s ease-in-out infinite;
  }

  /* Keyframe Animations */
  @keyframes gl-spin {
    0% {
      transform: rotate(0deg);
      stroke-dashoffset: 200;
    }
    50% {
      stroke-dashoffset: 60;
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(360deg);
      stroke-dashoffset: 200;
    }
  }

  @keyframes gl-pulse {
    0%, 100% {
      transform: scale(0.85);
      opacity: 0.75;
    }
    50% {
      transform: scale(1.08);
      opacity: 1;
    }
  }
</style>
